<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room · Gaussian Splat Viewer</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e8e8e0;font-family:system-ui,sans-serif;color:#2b4540}canvas{width:100vw;height:100vh;display:block;touch-action:none}header{position:absolute;left:28px;top:24px;pointer-events:none}h1{font-size:25px;font-weight:500;margin:8px 0}small{letter-spacing:2px}p{font-size:12px;line-height:1.8;margin:0}.bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:5px;background:#ffffffcf;padding:9px;border-radius:14px;width:max-content;max-width:96vw}button,a{border:0;background:#f4f5ee;padding:11px 13px;border-radius:8px;color:#2b4540;text-decoration:none;font-size:12px;cursor:pointer}#status{position:absolute;right:24px;top:25px;font-size:12px;text-align:right;line-height:1.8}label{font-size:12px;display:flex;align-items:center;padding:0 8px;gap:8px}input{width:90px}@media(max-width:800px){#status{top:135px;left:28px;right:auto;text-align:left}h1{font-size:20px}.bar{bottom:10px}button,a{padding:9px}}</style>
<canvas id="view"></canvas><header><small>GAUSSIAN SURFACE STUDY / 02 · HIGH DENSITY</small><h1>Room · Gaussian Splat Viewer</h1><p>Corrected, decluttered room · __COUNT__ anisotropic Gaussians<br>Derived from model surfaces — not trained from photographs.<br>Drag to orbit · Scroll or pinch to zoom</p></header><div id="status">Loading Gaussian data…</div><div class="bar"><button id="home">Overview</button><button id="top">Top view</button><button id="bath">Entry / Bath</button><button id="reverse">Reverse</button><button id="walls">Outer walls: Auto</button><label>Splat size <input id="size" type="range" min="0.55" max="1.4" step="0.05" value="1"></label><a href="room-gaussians.ply" download>Download PLY</a><a href="room-viewer.html">Mesh view</a></div>
<script>
const encoded='__DATA__',groups=__GROUPS__,raw=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0)),data=new Float32Array(raw.buffer),N=data.length/12;
const canvas=document.getElementById('view'),gl=canvas.getContext('webgl',{antialias:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('status').textContent='WebGL is unavailable in this browser.';throw Error('WebGL unavailable')}
const vertex=`precision highp float;attribute vec3 p;attribute vec3 n;attribute vec3 color;attribute vec2 shape;uniform vec3 right;uniform vec3 up;uniform vec3 back;uniform vec3 target;uniform vec2 viewport;uniform float zoom;uniform float sizeFactor;uniform float maxSize;varying vec3 col;varying vec3 conic;varying float halfSize;varying float opacity;
void main(){vec3 v=p-target;float pix=viewport.y/zoom;gl_Position=vec4(dot(v,right)*2./(zoom*viewport.x/viewport.y),dot(v,up)*2./zoom,-dot(v,back)*.06,1.);float s=shape.x*sizeFactor*pix;vec2 nn=vec2(dot(n,right),dot(n,up));float a=s*s*(1.-.9856*nn.x*nn.x)+.3;float b=-s*s*.9856*nn.x*nn.y;float c=s*s*(1.-.9856*nn.y*nn.y)+.3;float det=max(a*c-b*b,.00001);conic=vec3(c,-b,a)/det;float eig=.5*(a+c+sqrt((a-c)*(a-c)+4.*b*b));gl_PointSize=min(maxSize,ceil(6.*sqrt(eig)));halfSize=gl_PointSize*.5;col=color;opacity=shape.y;}`;
const fragment=`precision highp float;varying vec3 col;varying vec3 conic;varying float halfSize;varying float opacity;void main(){vec2 d=(gl_PointCoord-.5)*2.*halfSize;d.y=-d.y;float e=-.5*(conic.x*d.x*d.x+2.*conic.y*d.x*d.y+conic.z*d.y*d.y);if(e<-4.5)discard;float a=min(.99,opacity*exp(e));gl_FragColor=vec4(col*a,a);}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);for(const [name,len,offset] of [['p',3,0],['n',3,3],['color',3,6],['shape',2,9]]){const l=gl.getAttribLocation(prog,name);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,len,gl.FLOAT,false,44,offset*4)}
const U={};for(const n of ['right','up','back','target','viewport','zoom','sizeFactor','maxSize'])U[n]=gl.getUniformLocation(prog,n);
let yaw=-.82,pitch=.85,zoom=9.7,target=[1.55,.65,3.05],wallMode=0,sizeFactor=1,pending=false;
const samples=[];for(const x of [.4,1.4,2.8])for(const z of [.7,2.5,4.2])samples.push([x,.65,z]);for(const z of [5,6.3,7.1])samples.push([.55,.65,z],[2.6,.7,z]);
function hits(o,d,b){let lo=.03,hi=40;for(let k=0;k<3;k++){if(Math.abs(d[k])<1e-7){if(o[k]<b[0][k]||o[k]>b[1][k])return false}else{let a=(b[0][k]-o[k])/d[k],c=(b[1][k]-o[k])/d[k];if(a>c)[a,c]=[c,a];lo=Math.max(lo,a);hi=Math.min(hi,c);if(lo>hi)return false}}return true}
function hiddenFor(back){const names=new Set();groups.forEach(g=>{if(g.autoCutaway&&(wallMode===2||(wallMode===0&&samples.some(p=>hits(p,back,g.bounds)))))names.add(g.name)});return groups.map(g=>names.has(g.name)||names.has(g.wallOwner))}
const sorted=new Float32Array(N*11),depth=new Float32Array(N),ids=new Uint32Array(N);for(let i=0;i<N;i++)ids[i]=i;
function render(){pending=false;let ratio=Math.min(devicePixelRatio,1.5),w=Math.floor(innerWidth*ratio),h=Math.floor(innerHeight*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.clearColor(.91,.91,.88,1);gl.clear(gl.COLOR_BUFFER_BIT);const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),r=[cy,0,-sy],u=[-sy*sp,cp,-cy*sp],b=[sy*cp,sp,cy*cp],hidden=hiddenFor(b);
for(let i=0;i<N;i++){let k=i*12;depth[i]=data[k]*b[0]+data[k+1]*b[1]+data[k+2]*b[2]}ids.sort((a,b)=>depth[a]-depth[b]);let count=0;for(let j=0;j<N;j++){let i=ids[j],k=i*12;if(hidden[data[k+11]])continue;if(data[k+3]*b[0]+data[k+4]*b[1]+data[k+5]*b[2]<-.08)continue;sorted.set(data.subarray(k,k+11),count*11);count++}
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,sorted.subarray(0,count*11),gl.DYNAMIC_DRAW);gl.uniform3fv(U.right,r);gl.uniform3fv(U.up,u);gl.uniform3fv(U.back,b);gl.uniform3fv(U.target,target);gl.uniform2f(U.viewport,w,h);gl.uniform1f(U.zoom,zoom);gl.uniform1f(U.sizeFactor,sizeFactor);gl.uniform1f(U.maxSize,gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1]);gl.disable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.drawArrays(gl.POINTS,0,count);document.getElementById('status').textContent=N.toLocaleString()+' total Gaussians\n'+count.toLocaleString()+' visible · Offline / Local';window.modelReady=true;}
function draw(){if(!pending){pending=true;requestAnimationFrame(render)}}
let pointers=new Map(),last=null,dist=0;canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);last=[e.clientX,e.clientY]};canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===2){let[a,b]=[...pointers.values()],dd=Math.hypot(a[0]-b[0],a[1]-b[1]);if(dist)zoom=Math.max(2.5,Math.min(18,zoom*dist/dd));dist=dd}else{yaw-=(e.clientX-last[0])*.007;pitch=Math.max(.15,Math.min(1.56,pitch+(e.clientY-last[1])*.007))}last=[e.clientX,e.clientY];draw()};canvas.onpointerup=canvas.onpointercancel=e=>{pointers.delete(e.pointerId);dist=0};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(2.5,Math.min(18,zoom*Math.exp(e.deltaY*.001)));draw()};window.onresize=draw;
document.getElementById('home').onclick=()=>{yaw=-.82;pitch=.85;zoom=9.7;target=[1.55,.65,3.05];draw()};document.getElementById('top').onclick=()=>{yaw=0;pitch=1.56;zoom=10;target=[1.55,.65,3.05];draw()};document.getElementById('bath').onclick=()=>{yaw=-.95;pitch=1.37;zoom=5.5;target=[1.5,.7,6.1];draw()};document.getElementById('reverse').onclick=()=>{yaw+=Math.PI;draw()};document.getElementById('walls').onclick=e=>{wallMode=(wallMode+1)%3;e.target.textContent=['Outer walls: Auto','Outer walls: Show','Outer walls: Hide'][wallMode];draw()};document.getElementById('size').oninput=e=>{sizeFactor=+e.target.value;draw()};draw();
</script></html>
